<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic Explorer</title>
<style>
  :root {
    --bg:              #0f1117;
    --surface:         #161b2e;
    --surface-hover:   #1a2035;
    --border:          #1e2433;
    --border-input:    #2d3748;
    --border-focus:    #7c3aed;
    --text-primary:    #f1f5f9;
    --text-secondary:  #94a3b8;
    --text-muted:      #8392a8;
    --accent:          #7c3aed;
    --accent-hover:    #6d28d9;
    --accent-fg:       #ffffff;
    --accent-dis-bg:   #3b2a6a;
    --accent-dis-fg:   #7c6aab;
    --header-title:    #a78bfa;
    --err-bg:          #2d1515;
    --err-border:      #7f1d1d;
    --err-text:        #fca5a5;
    --badge-beg-bg:    #14532d; --badge-beg-fg: #86efac;
    --badge-int-bg:    #713f12; --badge-int-fg: #fde68a;
    --badge-adv-bg:    #7f1d1d; --badge-adv-fg: #fca5a5;
    --badge-field-bg:  #1e1b4b; --badge-field-fg: #a5b4fc;
    --card-prereq:     #7c3aed;
    --card-connected:  #0891b2;
    --card-next:       #059669;
    --history-bg:      #161b2e;
    --history-border:  #2d3748;
    --history-fg:      #94a3b8;
    --history-fg-hov:  #c4b5fd;
    --history-bord-hov:#7c3aed;
    --clear-fg:        #4b5563;
    --clear-fg-hov:    #ef4444;
  }

  [data-theme="light"] {
    --bg:              #f8fafc;
    --surface:         #ffffff;
    --surface-hover:   #f1f5f9;
    --border:          #e2e8f0;
    --border-input:    #cbd5e1;
    --border-focus:    #6d28d9;
    --text-primary:    #1e293b;
    --text-secondary:  #475569;
    --text-muted:      #64748b;
    --accent:          #6d28d9;
    --accent-hover:    #5b21b6;
    --accent-fg:       #ffffff;
    --accent-dis-bg:   #ede9fe;
    --accent-dis-fg:   #7c3aed;
    --header-title:    #5b21b6;
    --err-bg:          #fef2f2;
    --err-border:      #fecaca;
    --err-text:        #991b1b;
    --badge-beg-bg:    #dcfce7; --badge-beg-fg: #166534;
    --badge-int-bg:    #fef3c7; --badge-int-fg: #92400e;
    --badge-adv-bg:    #fee2e2; --badge-adv-fg: #991b1b;
    --badge-field-bg:  #ede9fe; --badge-field-fg: #4c1d95;
    --card-prereq:     #6d28d9;
    --card-connected:  #0e7490;
    --card-next:       #047857;
    --history-bg:      #f1f5f9;
    --history-border:  #cbd5e1;
    --history-fg:      #475569;
    --history-fg-hov:  #5b21b6;
    --history-bord-hov:#6d28d9;
    --clear-fg:        #94a3b8;
    --clear-fg-hov:    #dc2626;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    transition: background 0.2s, color 0.2s;
  }

  header {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  header h1 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--header-title);
    letter-spacing: -0.01em;
  }

  .header-actions { display: flex; gap: 6px; align-items: center; }

  .hdr-btn {
    background: none;
    border: 1px solid var(--border-input);
    color: var(--text-secondary);
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.78rem;
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .hdr-btn:hover { border-color: var(--accent); color: var(--text-primary); }

  #key-section {
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: none;
  }
  #key-section.open { display: block; }

  #key-section label {
    font-size: 0.72rem;
    color: var(--text-muted);
    display: block;
    margin-bottom: 5px;
  }

  #key-section input {
    width: 100%;
    max-width: 440px;
    background: var(--bg);
    border: 1px solid var(--border-input);
    color: var(--text-primary);
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 0.82rem;
    font-family: monospace;
    outline: none;
    transition: border-color 0.15s;
  }
  #key-section input:focus { border-color: var(--border-focus); }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 20px 18px;
  }

  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  #topic-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border-input);
    color: var(--text-primary);
    padding: 9px 13px;
    border-radius: 6px;
    font-size: 0.92rem;
    outline: none;
    transition: border-color 0.15s;
  }
  #topic-input:focus { border-color: var(--border-focus); }
  #topic-input::placeholder { color: var(--text-muted); opacity: 0.7; }

  #explore-btn {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  #explore-btn:hover { background: var(--accent-hover); }
  #explore-btn:disabled { background: var(--accent-dis-bg); color: var(--accent-dis-fg); cursor: not-allowed; }

  #error-msg {
    background: var(--err-bg);
    border: 1px solid var(--err-border);
    color: var(--err-text);
    padding: 8px 12px;
    border-radius: 5px;
    font-size: 0.82rem;
    margin-bottom: 16px;
    display: none;
  }

  .spinner {
    display: none;
    text-align: center;
    padding: 36px 0;
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .spinner.active { display: block; }
  .spinner::before {
    content: '';
    display: block;
    width: 26px;
    height: 26px;
    border: 2px solid var(--border-input);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #result { display: none; }

  .topic-header { margin-bottom: 18px; }

  .topic-header h2 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 5px;
  }

  .topic-header p {
    color: var(--text-secondary);
    font-size: 0.88rem;
    line-height: 1.5;
  }

  .meta-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .badge {
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge-level-beginner     { background: var(--badge-beg-bg); color: var(--badge-beg-fg); }
  .badge-level-intermediate { background: var(--badge-int-bg); color: var(--badge-int-fg); }
  .badge-level-advanced     { background: var(--badge-adv-bg); color: var(--badge-adv-fg); }
  .badge-field { background: var(--badge-field-bg); color: var(--badge-field-fg); }

  .section { margin-bottom: 18px; }

  .section-title {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 7px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 11px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .card:hover { border-color: var(--accent); background: var(--surface-hover); }

  .card-name {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 3px;
  }

  .card-why {
    font-size: 0.75rem;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  .card.prereq    { border-left: 3px solid var(--card-prereq); }
  .card.connected { border-left: 3px solid var(--card-connected); }
  .card.next      { border-left: 3px solid var(--card-next); }

  #history-section {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  #history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .history-tag {
    background: var(--history-bg);
    border: 1px solid var(--history-border);
    color: var(--history-fg);
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.76rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .history-tag:hover { border-color: var(--history-bord-hov); color: var(--history-fg-hov); }

  .clear-btn {
    background: none;
    border: none;
    color: var(--clear-fg);
    font-size: 0.72rem;
    cursor: pointer;
    margin-left: 6px;
    transition: color 0.15s;
  }
  .clear-btn:hover { color: var(--clear-fg-hov); }
</style>
</head>
<body>

<header>
  <h1>🔭 Topic Explorer</h1>
  <div class="header-actions">
    <button class="hdr-btn" id="theme-toggle" aria-label="Toggle theme">☀ Light</button>
    <button class="hdr-btn" id="key-toggle">⚙ API Key</button>
  </div>
</header>

<div id="key-section">
  <label>Anthropic API Key (saved in your browser only)</label>
  <input type="password" id="api-key-input" placeholder="sk-ant-...">
</div>

<main>
  <div class="search-row">
    <input id="topic-input" type="text" placeholder="Enter a topic, e.g. harness engineering…" autocomplete="off">
    <button id="explore-btn">Explore →</button>
  </div>

  <div id="error-msg"></div>
  <div class="spinner" id="spinner">Exploring topic…</div>

  <div id="result">
    <div class="topic-header">
      <h2 id="r-name"></h2>
      <p id="r-desc"></p>
      <div class="meta-row">
        <span class="badge" id="r-level"></span>
        <span class="badge badge-field" id="r-field"></span>
      </div>
    </div>

    <div class="section" id="sec-prereq">
      <div class="section-title">Prerequisites — know these first</div>
      <div class="cards" id="cards-prereq"></div>
    </div>

    <div class="section" id="sec-connected">
      <div class="section-title">Connected topics</div>
      <div class="cards" id="cards-connected"></div>
    </div>

    <div class="section" id="sec-next">
      <div class="section-title">What to explore next</div>
      <div class="cards" id="cards-next"></div>
    </div>
  </div>

  <div id="history-section" style="display:none">
    <div class="section-title">
      Previously explored
      <button class="clear-btn" id="clear-history">clear</button>
    </div>
    <div id="history-list"></div>
  </div>
</main>

<script>
const STORAGE_KEY  = 'topic_explorer_history';
const API_KEY_KEY  = 'topic_explorer_apikey';
const THEME_KEY    = 'topic_explorer_theme';

const keyToggle    = document.getElementById('key-toggle');
const keySection   = document.getElementById('key-section');
const apiKeyInput  = document.getElementById('api-key-input');
const topicInput   = document.getElementById('topic-input');
const exploreBtn   = document.getElementById('explore-btn');
const errorMsg     = document.getElementById('error-msg');
const spinner      = document.getElementById('spinner');
const result       = document.getElementById('result');
const historySec   = document.getElementById('history-section');
const historyList  = document.getElementById('history-list');
const themeToggle  = document.getElementById('theme-toggle');

// ── Theme ─────────────────────────────────────────────────────
const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
applyTheme(savedTheme);

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeToggle.textContent = theme === 'dark' ? '☀ Light' : '☾ Dark';
  localStorage.setItem(THEME_KEY, theme);
}

themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

// ── API Key ───────────────────────────────────────────────────
const savedKey = localStorage.getItem(API_KEY_KEY);
if (savedKey) apiKeyInput.value = savedKey;

apiKeyInput.addEventListener('change', () => {
  localStorage.setItem(API_KEY_KEY, apiKeyInput.value.trim());
});

keyToggle.addEventListener('click', () => keySection.classList.toggle('open'));

// ── History ───────────────────────────────────────────────────
function getHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}

function saveToHistory(topic, data) {
  const h = getHistory();
  h[topic.toLowerCase()] = { topic, data, ts: Date.now() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
  renderHistory();
}

function renderHistory() {
  const h = getHistory();
  const keys = Object.keys(h).sort((a, b) => h[b].ts - h[a].ts);
  if (!keys.length) { historySec.style.display = 'none'; return; }
  historySec.style.display = 'block';
  historyList.innerHTML = keys.map(k =>
    `<span class="history-tag" data-topic="${h[k].topic}">${h[k].topic}</span>`
  ).join('');
  historyList.querySelectorAll('.history-tag').forEach(el => {
    el.addEventListener('click', () => {
      const cached = h[el.dataset.topic.toLowerCase()];
      if (cached) { topicInput.value = cached.topic; displayResult(cached.data); }
    });
  });
}

document.getElementById('clear-history').addEventListener('click', () => {
  localStorage.removeItem(STORAGE_KEY);
  renderHistory();
});

renderHistory();

// ── API call ──────────────────────────────────────────────────
async function exploreTopic(topic) {
  const apiKey = apiKeyInput.value.trim() || localStorage.getItem(API_KEY_KEY) || '';
  if (!apiKey) throw new Error('Please enter your Anthropic API key (click ⚙ API Key above).');

  const systemPrompt = `You are a knowledgeable teacher. When given a topic, return ONLY valid JSON (no markdown, no explanation) with this exact structure:
{
  "name": "exact topic name",
  "description": "2-3 sentence explanation of what this topic is",
  "level": "beginner" | "intermediate" | "advanced",
  "field": "the broader field this belongs to",
  "prerequisites": [
    { "name": "topic name", "why": "one sentence on why this is needed first" }
  ],
  "connected": [
    { "name": "topic name", "why": "one sentence on how it relates" }
  ],
  "next": [
    { "name": "topic name", "why": "one sentence on why to explore this after" }
  ]
}
Include 3–6 items in each array. Return only the JSON object.`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5',
      max_tokens: 1024,
      system: systemPrompt,
      messages: [{ role: 'user', content: `Topic: ${topic}` }],
    }),
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API error ${resp.status}`);
  }

  const json = await resp.json();
  const text = json.content?.[0]?.text || '';
  try {
    return JSON.parse(text);
  } catch {
    const match = text.match(/\{[\s\S]*\}/);
    if (match) return JSON.parse(match[0]);
    throw new Error('Could not parse response. Try again.');
  }
}

// ── Render result ─────────────────────────────────────────────
function makeCards(items, cls) {
  return items.map(item => `
    <div class="card ${cls}" data-topic="${item.name}">
      <div class="card-name">${item.name}</div>
      <div class="card-why">${item.why}</div>
    </div>
  `).join('');
}

function displayResult(data) {
  document.getElementById('r-name').textContent = data.name;
  document.getElementById('r-desc').textContent = data.description;

  const levelEl = document.getElementById('r-level');
  levelEl.textContent = data.level;
  levelEl.className = `badge badge-level-${data.level}`;

  document.getElementById('r-field').textContent = data.field;

  document.getElementById('cards-prereq').innerHTML    = makeCards(data.prerequisites || [], 'prereq');
  document.getElementById('cards-connected').innerHTML = makeCards(data.connected || [], 'connected');
  document.getElementById('cards-next').innerHTML      = makeCards(data.next || [], 'next');

  result.style.display = 'block';

  result.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      topicInput.value = card.dataset.topic;
      run(card.dataset.topic);
    });
  });
}

// ── Main flow ─────────────────────────────────────────────────
function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}

function clearError() { errorMsg.style.display = 'none'; }

async function run(topic) {
  clearError();
  result.style.display = 'none';
  spinner.classList.add('active');
  exploreBtn.disabled = true;

  const h = getHistory();
  const cached = h[topic.toLowerCase()];
  if (cached) {
    spinner.classList.remove('active');
    exploreBtn.disabled = false;
    displayResult(cached.data);
    return;
  }

  try {
    const data = await exploreTopic(topic);
    saveToHistory(topic, data);
    displayResult(data);
  } catch (e) {
    showError(e.message);
  } finally {
    spinner.classList.remove('active');
    exploreBtn.disabled = false;
  }
}

exploreBtn.addEventListener('click', () => {
  const topic = topicInput.value.trim();
  if (topic) run(topic);
});

topicInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const topic = topicInput.value.trim();
    if (topic) run(topic);
  }
});
</script>
</body>
</html>
