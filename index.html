<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic Explorer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
  }

  header {
    padding: 20px 24px;
    border-bottom: 1px solid #1e2433;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  header h1 {
    font-size: 1.2rem;
    font-weight: 600;
    color: #a78bfa;
    letter-spacing: -0.02em;
  }

  #key-toggle {
    background: none;
    border: 1px solid #2d3748;
    color: #94a3b8;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: border-color 0.15s;
  }
  #key-toggle:hover { border-color: #4a5568; color: #e2e8f0; }

  #key-section {
    padding: 12px 24px;
    background: #161b2e;
    border-bottom: 1px solid #1e2433;
    display: none;
  }
  #key-section.open { display: block; }

  #key-section label {
    font-size: 0.75rem;
    color: #64748b;
    display: block;
    margin-bottom: 6px;
  }

  #key-section input {
    width: 100%;
    max-width: 480px;
    background: #0f1117;
    border: 1px solid #2d3748;
    color: #e2e8f0;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-family: monospace;
    outline: none;
  }
  #key-section input:focus { border-color: #7c3aed; }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
  }

  #topic-input {
    flex: 1;
    background: #161b2e;
    border: 1px solid #2d3748;
    color: #e2e8f0;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.15s;
  }
  #topic-input:focus { border-color: #7c3aed; }
  #topic-input::placeholder { color: #3a4559; }

  #explore-btn {
    background: #7c3aed;
    color: #fff;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  #explore-btn:hover { background: #6d28d9; }
  #explore-btn:disabled { background: #3b2a6a; color: #7c6aab; cursor: not-allowed; }

  #error-msg {
    background: #2d1515;
    border: 1px solid #7f1d1d;
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 20px;
    display: none;
  }

  .spinner {
    display: none;
    text-align: center;
    padding: 48px 0;
    color: #4a5568;
    font-size: 0.9rem;
  }
  .spinner.active { display: block; }
  .spinner::before {
    content: '';
    display: block;
    width: 32px;
    height: 32px;
    border: 3px solid #2d3748;
    border-top-color: #7c3aed;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #result { display: none; }

  .topic-header {
    margin-bottom: 28px;
  }

  .topic-header h2 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #c4b5fd;
    margin-bottom: 8px;
  }

  .topic-header p {
    color: #94a3b8;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .meta-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .badge {
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .badge-level-beginner   { background: #14532d; color: #86efac; }
  .badge-level-intermediate { background: #713f12; color: #fde68a; }
  .badge-level-advanced   { background: #7f1d1d; color: #fca5a5; }
  .badge-field { background: #1e1b4b; color: #a5b4fc; }

  .section {
    margin-bottom: 28px;
  }

  .section-title {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #4a5568;
    margin-bottom: 12px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }

  .card {
    background: #161b2e;
    border: 1px solid #1e2433;
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .card:hover { border-color: #7c3aed; background: #1a1f35; }

  .card-name {
    font-size: 0.9rem;
    font-weight: 500;
    color: #e2e8f0;
    margin-bottom: 4px;
  }

  .card-why {
    font-size: 0.78rem;
    color: #64748b;
    line-height: 1.4;
  }

  .card.prereq { border-left: 3px solid #7c3aed; }
  .card.connected { border-left: 3px solid #0891b2; }
  .card.next { border-left: 3px solid #059669; }

  /* history sidebar */
  #history-section {
    margin-top: 40px;
    padding-top: 28px;
    border-top: 1px solid #1e2433;
  }

  #history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .history-tag {
    background: #161b2e;
    border: 1px solid #2d3748;
    color: #94a3b8;
    padding: 5px 12px;
    border-radius: 99px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .history-tag:hover { border-color: #7c3aed; color: #c4b5fd; }

  .clear-btn {
    background: none;
    border: none;
    color: #374151;
    font-size: 0.75rem;
    cursor: pointer;
    margin-left: 8px;
  }
  .clear-btn:hover { color: #ef4444; }
</style>
</head>
<body>

<header>
  <h1>🔭 Topic Explorer</h1>
  <button id="key-toggle">⚙ API Key</button>
</header>

<div id="key-section">
  <label>Anthropic API Key (saved in your browser only)</label>
  <input type="password" id="api-key-input" placeholder="sk-ant-...">
</div>

<main>
  <div class="search-row">
    <input id="topic-input" type="text" placeholder="Enter a topic, e.g. harness engineering…" autocomplete="off">
    <button id="explore-btn">Explore →</button>
  </div>

  <div id="error-msg"></div>
  <div class="spinner" id="spinner">Exploring topic…</div>

  <div id="result">
    <div class="topic-header">
      <h2 id="r-name"></h2>
      <p id="r-desc"></p>
      <div class="meta-row">
        <span class="badge" id="r-level"></span>
        <span class="badge badge-field" id="r-field"></span>
      </div>
    </div>

    <div class="section" id="sec-prereq">
      <div class="section-title">Prerequisites — know these first</div>
      <div class="cards" id="cards-prereq"></div>
    </div>

    <div class="section" id="sec-connected">
      <div class="section-title">Connected topics</div>
      <div class="cards" id="cards-connected"></div>
    </div>

    <div class="section" id="sec-next">
      <div class="section-title">What to explore next</div>
      <div class="cards" id="cards-next"></div>
    </div>
  </div>

  <div id="history-section" style="display:none">
    <div class="section-title" style="margin-bottom:12px">
      Previously explored
      <button class="clear-btn" id="clear-history">clear</button>
    </div>
    <div id="history-list"></div>
  </div>
</main>

<script>
const STORAGE_KEY = 'topic_explorer_history';
const API_KEY_KEY = 'topic_explorer_apikey';

const keyToggle    = document.getElementById('key-toggle');
const keySection   = document.getElementById('key-section');
const apiKeyInput  = document.getElementById('api-key-input');
const topicInput   = document.getElementById('topic-input');
const exploreBtn   = document.getElementById('explore-btn');
const errorMsg     = document.getElementById('error-msg');
const spinner      = document.getElementById('spinner');
const result       = document.getElementById('result');
const historySec   = document.getElementById('history-section');
const historyList  = document.getElementById('history-list');

// Restore API key
const savedKey = localStorage.getItem(API_KEY_KEY);
if (savedKey) apiKeyInput.value = savedKey;

apiKeyInput.addEventListener('change', () => {
  localStorage.setItem(API_KEY_KEY, apiKeyInput.value.trim());
});

keyToggle.addEventListener('click', () => keySection.classList.toggle('open'));

// ── History ──────────────────────────────────────────────────
function getHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}

function saveToHistory(topic, data) {
  const h = getHistory();
  h[topic.toLowerCase()] = { topic, data, ts: Date.now() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
  renderHistory();
}

function renderHistory() {
  const h = getHistory();
  const keys = Object.keys(h).sort((a, b) => h[b].ts - h[a].ts);
  if (!keys.length) { historySec.style.display = 'none'; return; }
  historySec.style.display = 'block';
  historyList.innerHTML = keys.map(k =>
    `<span class="history-tag" data-topic="${h[k].topic}">${h[k].topic}</span>`
  ).join('');
  historyList.querySelectorAll('.history-tag').forEach(el => {
    el.addEventListener('click', () => {
      const cached = h[el.dataset.topic.toLowerCase()];
      if (cached) { topicInput.value = cached.topic; displayResult(cached.data); }
    });
  });
}

document.getElementById('clear-history').addEventListener('click', () => {
  localStorage.removeItem(STORAGE_KEY);
  renderHistory();
});

renderHistory();

// ── API call ─────────────────────────────────────────────────
async function exploreTopic(topic) {
  const apiKey = apiKeyInput.value.trim() || localStorage.getItem(API_KEY_KEY) || '';
  if (!apiKey) throw new Error('Please enter your Anthropic API key (click ⚙ API Key above).');

  const systemPrompt = `You are a knowledgeable teacher. When given a topic, return ONLY valid JSON (no markdown, no explanation) with this exact structure:
{
  "name": "exact topic name",
  "description": "2-3 sentence explanation of what this topic is",
  "level": "beginner" | "intermediate" | "advanced",
  "field": "the broader field this belongs to",
  "prerequisites": [
    { "name": "topic name", "why": "one sentence on why this is needed first" }
  ],
  "connected": [
    { "name": "topic name", "why": "one sentence on how it relates" }
  ],
  "next": [
    { "name": "topic name", "why": "one sentence on why to explore this after" }
  ]
}
Include 3–6 items in each array. Return only the JSON object.`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5',
      max_tokens: 1024,
      system: systemPrompt,
      messages: [{ role: 'user', content: `Topic: ${topic}` }],
    }),
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API error ${resp.status}`);
  }

  const json = await resp.json();
  const text = json.content?.[0]?.text || '';
  try {
    return JSON.parse(text);
  } catch {
    // try to extract JSON from the text
    const match = text.match(/\{[\s\S]*\}/);
    if (match) return JSON.parse(match[0]);
    throw new Error('Could not parse response. Try again.');
  }
}

// ── Render result ─────────────────────────────────────────────
function makeCards(items, cls) {
  return items.map(item => `
    <div class="card ${cls}" data-topic="${item.name}">
      <div class="card-name">${item.name}</div>
      <div class="card-why">${item.why}</div>
    </div>
  `).join('');
}

function displayResult(data) {
  document.getElementById('r-name').textContent = data.name;
  document.getElementById('r-desc').textContent = data.description;

  const levelEl = document.getElementById('r-level');
  levelEl.textContent = data.level;
  levelEl.className = `badge badge-level-${data.level}`;

  document.getElementById('r-field').textContent = data.field;

  document.getElementById('cards-prereq').innerHTML    = makeCards(data.prerequisites || [], 'prereq');
  document.getElementById('cards-connected').innerHTML = makeCards(data.connected || [], 'connected');
  document.getElementById('cards-next').innerHTML      = makeCards(data.next || [], 'next');

  result.style.display = 'block';

  // Click a card to explore that topic
  result.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      topicInput.value = card.dataset.topic;
      run(card.dataset.topic);
    });
  });
}

// ── Main flow ─────────────────────────────────────────────────
function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}

function clearError() {
  errorMsg.style.display = 'none';
}

async function run(topic) {
  clearError();
  result.style.display = 'none';
  spinner.classList.add('active');
  exploreBtn.disabled = true;

  // Check local cache first
  const h = getHistory();
  const cached = h[topic.toLowerCase()];
  if (cached) {
    spinner.classList.remove('active');
    exploreBtn.disabled = false;
    displayResult(cached.data);
    return;
  }

  try {
    const data = await exploreTopic(topic);
    saveToHistory(topic, data);
    displayResult(data);
  } catch (e) {
    showError(e.message);
  } finally {
    spinner.classList.remove('active');
    exploreBtn.disabled = false;
  }
}

exploreBtn.addEventListener('click', () => {
  const topic = topicInput.value.trim();
  if (topic) run(topic);
});

topicInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const topic = topicInput.value.trim();
    if (topic) run(topic);
  }
});
</script>
</body>
</html>
